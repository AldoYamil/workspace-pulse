
services:
  db:
    image: postgres:15-alpine
    container_name: workspace_pulse_db
    restart: always
    environment:
      POSTGRES_DB: workspace_db
      POSTGRES_USER: user_demo
      POSTGRES_PASSWORD: password_demo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
