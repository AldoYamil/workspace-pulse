version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: workspace_pulse_db
    restart: always
    environment:
      POSTGRES_DB: workspace_db
      POSTGRES_USER: generic_user
      POSTGRES_PASSWORD: generic_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
